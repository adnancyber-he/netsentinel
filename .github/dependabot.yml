version: 2
updates:
  # ---- Go modules ----
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group all gopacket-related bumps into one PR
      gopacket:
        patterns:
          - "github.com/google/gopacket*"
      # Group TUI libraries
      tui:
        patterns:
          - "github.com/rivo/tview"
          - "github.com/gdamore/tcell*"
      # Group cobra + viper (spf13) together
      spf13:
        patterns:
          - "github.com/spf13/*"
      # Everything else, up to 5 PRs at a time
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/google/gopacket*"
          - "github.com/rivo/tview"
          - "github.com/gdamore/tcell*"
          - "github.com/spf13/*"
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"