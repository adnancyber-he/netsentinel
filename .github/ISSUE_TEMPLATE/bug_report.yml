name:  Bug Report
description: Report a problem with NetSentinel
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I am running the latest release or `main` branch
          required: true
        - label: I have read the README and CONTRIBUTING guide
          required: true

  - type: input
    id: version
    attributes:
      label: NetSentinel version
      description: Output of `netsentinel --version`
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "Ubuntu 24.04 / macOS 14.5 / Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: libpcap
    attributes:
      label: libpcap / Npcap version
      description: Run `pcap-config --version` (Linux/macOS) or check Npcap properties (Windows)
      placeholder: "libpcap 1.10.4 / Npcap 1.79"

  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: "sudo ./netsentinel -i eth0 -f 'tcp port 443'"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include full error messages and stack traces
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
      placeholder: Paste any output here

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction steps
      placeholder: |
        1. Run `...`
        2. Generate traffic with `...`
        3. Observe `...`

  - type: textarea
    id: pcap
    attributes:
      label: Sanitized pcap (if applicable)
      description: |
        If this is a parsing bug, attach a `.pcap` file with sensitive
        data removed. Drag & drop the file into this box.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help