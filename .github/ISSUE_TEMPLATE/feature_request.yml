name: Feature Request
description: Suggest an idea or enhancement for NetSentinel
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape NetSentinel! Before submitting, please
        check the [Roadmap](../README.md#-roadmap) to avoid duplicates.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have checked the roadmap and this is not already planned
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain point, not the solution
      placeholder: "I want to detect X but currently have to do Y manually..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like NetSentinel to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about

  - type: textarea
    id: example
    attributes:
      label: Usage example
      description: Show how the feature would be used (CLI, config, output, etc.)
      render: shell
      placeholder: |
        sudo ./netsentinel -i eth0 --detect-arp-spoof --alert-webhook https://...

  - type: dropdown
    id: area
    attributes:
      label: Area of the codebase
      options:
        - Capture
        - Parsing
        - Analysis / Detection
        - TUI / Dashboard
        - Reporting
        - CLI / Configuration
        - Plugin system
        - CI / Build / Packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: Would you be willing to implement this?
      options:
        - label: Yes, I can submit a PR
        - label: Yes, with guidance
        - label: No, but I can help test

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, references, links to similar tools, etc.