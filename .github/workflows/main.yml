name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: netsentinel-linux-amd64
          - os: ubuntu-24.04-arm64
            goos: linux
            goarch: arm64
            artifact: netsentinel-linux-arm64
          - os: macos-14
            goos: darwin
            goarch: amd64
            artifact: netsentinel-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: netsentinel-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: netsentinel-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: true

      # ---- Linux: install cross-compilation toolchain ----
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install aarch64 cross-compiler (Linux ARM64)
        if: matrix.goarch == 'arm64' && runner.os == 'Linux'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
        # Add CC to environment only for ARM64
        # You can set it in the build step via ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}

      # ---- macOS: install libpcap via brew ----
      - name: Install libpcap (macOS)
        if: runner.os == 'macOS'
        run: brew install libpcap

      # ---- Windows: Npcap SDK ----
      - name: Download Npcap SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.16.zip

      - name: Extract wpcap.lib (Windows)
        if: runner.os == 'Windows'
        run: |
          tar -xvf npcap-sdk.zip Lib/x64/wpcap.lib
          copy Lib\x64\wpcap.lib .

      # ---- Build ----
      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CGO_LDFLAGS="-L$(pwd) -lwpcap"
          fi
          CC_ARG=""
          if [ "${{ matrix.goarch }}" = "arm64" ] && [ "${{ runner.os }}" = "Linux" ]; then
            CC_ARG="CC=aarch64-linux-gnu-gcc"
          fi
          eval $CC_ARG go build -trimpath -ldflags="-s -w" \
            -o ${{ matrix.artifact }} ./cmd/netsentinel

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
